{% extends "base.html" %}{% block body %}<section class="card"><h1>{% if s.id %}Edit Santri{% else %}Tambah Santri{% endif %}</h1><form method="post" enctype="multipart/form-data" class="formgrid"><label>Kode*<input name="code" value="{{s.code or ''}}" required></label><label>Nama lengkap*<input name="name" value="{{s.name or ''}}" required></label><label>NIS<input name="nis" value="{{s.nis or ''}}"></label><label>Pendidikan<input name="education" value="{{s.education or ''}}"></label><label>Kelas<input name="class_name" value="{{s.class_name or ''}}"></label><label>Asrama<input name="dorm" value="{{s.dorm or ''}}"></label><label>Kamar<input name="room" value="{{s.room or ''}}"></label><label>Status<select name="status"><option {% if s.status=='Aktif' %}selected{% endif %}>Aktif</option><option {% if s.status=='Nonaktif' %}selected{% endif %}>Nonaktif</option><option>Arsip</option></select></label><label>Nama wali<input name="guardian" value="{{s.guardian or ''}}"></label><label>Tanggungan (Rp)<input type="number" name="balance" value="{{s.balance or 0}}"></label><label>Foto<input type="file" name="photo" accept=".jpg,.jpeg,.png,.webp"></label><label class="wide">Catatan admin (privat)<textarea name="notes">{{s.notes or ''}}</textarea></label><label class="wide">Ringkasan pelanggaran (privat)<textarea name="violations">{{s.violations or ''}}</textarea></label><div class="wide"><button>Simpan</button><a class="btn outline" href="/admin/dashboard">Batal</a></div></form></section>{% endblock %}
